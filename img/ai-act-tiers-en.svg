<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 896" role="img" aria-labelledby="aiact-title">
  <title id="aiact-title">The AI Act at a glance: four risk tiers and their deadlines as amended by the Digital Omnibus</title>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .serif { font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, serif; }
  </style>
  <rect x="0" y="0" width="760" height="896" fill="#fbfaf7"/>

  <text class="serif" x="380" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#171512">The AI Act at a glance</text>
  <text class="sans" x="380" y="76" text-anchor="middle" font-size="15" fill="#6f6a61">Risk tiers, obligations, deadlines · as amended by the Digital Omnibus, July 2026</text>

  <!-- Tier 1: Prohibited -->
  <rect x="120" y="100" width="520" height="86" rx="10" fill="#b55e42"/>
  <text class="sans" x="140" y="136" font-size="20" font-weight="700" fill="#ffffff">Unacceptable risk: prohibited</text>
  <text class="sans" x="140" y="163" font-size="15.5" fill="#ffffff" opacity="0.92">Social scoring, manipulative systems</text>
  <text class="sans" x="620" y="136" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">since Feb 2025</text>

  <!-- Tier 2: High risk (postponed) -->
  <text class="sans" x="690" y="216" text-anchor="end" font-size="15" font-style="italic" fill="#b55e42">postponed by the omnibus</text>
  <rect x="64" y="224" width="632" height="262" rx="14" fill="none" stroke="#b55e42" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="70" y="230" width="620" height="250" rx="10" fill="#0d6b5f"/>
  <text class="sans" x="90" y="264" font-size="20" font-weight="700" fill="#ffffff">High risk: strict obligations</text>
  <rect x="90" y="282" width="580" height="82" rx="8" fill="#ffffff" opacity="0.13"/>
  <text class="sans" x="106" y="312" font-size="17.5" font-weight="700" fill="#ffffff">Stand-alone systems (Annex III)</text>
  <text class="sans" x="106" y="338" font-size="15" fill="#ffffff" opacity="0.9">Hiring, credit, public services</text>
  <text class="sans" x="654" y="312" text-anchor="end" font-size="15" fill="#ffffff" text-decoration="line-through" opacity="0.65">Aug 2, 2026</text>
  <text class="sans" x="654" y="338" text-anchor="end" font-size="17" font-weight="700" fill="#ffffff">→ Dec 2, 2027</text>
  <rect x="90" y="376" width="580" height="82" rx="8" fill="#ffffff" opacity="0.13"/>
  <text class="sans" x="106" y="406" font-size="17.5" font-weight="700" fill="#ffffff">In regulated products (Annex I)</text>
  <text class="sans" x="106" y="432" font-size="15" fill="#ffffff" opacity="0.9">e.g. medical devices, machinery</text>
  <text class="sans" x="654" y="406" text-anchor="end" font-size="15" fill="#ffffff" text-decoration="line-through" opacity="0.65">Aug 2, 2027</text>
  <text class="sans" x="654" y="432" text-anchor="end" font-size="17" font-weight="700" fill="#ffffff">→ Aug 2, 2028</text>

  <!-- Tier 3: Transparency -->
  <rect x="40" y="510" width="680" height="86" rx="10" fill="#d9e6df"/>
  <text class="sans" x="60" y="546" font-size="20" font-weight="700" fill="#171512">Limited risk: transparency</text>
  <text class="sans" x="60" y="573" font-size="15.5" fill="#6f6a61">Disclose chatbots, label deepfakes and AI content</text>
  <text class="sans" x="700" y="546" text-anchor="end" font-size="16" font-weight="700" fill="#084a42">from Aug 2, 2026</text>
  <text class="sans" x="700" y="573" text-anchor="end" font-size="14" fill="#6f6a61">unchanged</text>

  <!-- Tier 4: Minimal -->
  <rect x="20" y="616" width="720" height="84" rx="10" fill="#f1eee6" stroke="#e4ded2" stroke-width="1.5"/>
  <text class="sans" x="40" y="651" font-size="20" font-weight="700" fill="#171512">Minimal risk: no specific obligations</text>
  <text class="sans" x="40" y="678" font-size="15.5" fill="#6f6a61">Spam filters, recommender systems, most everyday applications</text>

  <!-- GPAI -->
  <rect x="20" y="720" width="720" height="90" rx="10" fill="none" stroke="#e4ded2" stroke-width="1.5"/>
  <text class="sans" x="40" y="754" font-size="17" font-weight="700" fill="#171512">Across all tiers: obligations for GPAI model providers</text>
  <text class="sans" x="40" y="781" font-size="15" fill="#6f6a61">Transparency, copyright, safety reporting · since Aug 2025 · unchanged</text>

  <!-- Legend + source -->
  <rect x="40" y="834" width="42" height="22" rx="6" fill="none" stroke="#b55e42" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="sans" x="96" y="850" font-size="15" fill="#171512">postponed by the Digital Omnibus (old deadline struck through)</text>
  <text class="sans" x="740" y="882" text-anchor="end" font-size="13.5" fill="#6f6a61">Source: Digital Omnibus, PE 30/2026</text>
</svg>

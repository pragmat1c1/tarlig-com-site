<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Enterprise Architect thinks above the systems; Solutions Architect builds into production; the foundation is a hands-on architect, a small core, and AI agents — under a real mandate">
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect x="64" y="64" width="1072" height="502" rx="18" fill="#ffffff" stroke="#e4ded2" stroke-width="2"/>

  <text x="112" y="142" font-family="Georgia, serif" font-size="40" fill="#171512">Two roles, one blurred title</text>

  <!-- Enterprise Architect: strategy layer -->
  <rect x="112" y="186" width="976" height="92" rx="10" fill="#f4f0e8" stroke="#d8cfbf" stroke-width="2"/>
  <text x="140" y="226" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#3c3832">Enterprise Architect</text>
  <text x="140" y="258" font-family="Arial, sans-serif" font-size="20" fill="#6f6a61">Landscape · target picture · governance — one level above the systems</text>

  <!-- arrow down -->
  <path d="M600 286v40" fill="none" stroke="#0d6b5f" stroke-width="6" stroke-linecap="round"/>
  <path d="M584 312l16 18 16-18" fill="none" stroke="#0d6b5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Solutions Architect: build layer -->
  <rect x="112" y="338" width="976" height="92" rx="10" fill="#171512"/>
  <text x="140" y="378" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fbfaf7">Solutions Architect</text>
  <text x="140" y="410" font-family="Arial, sans-serif" font-size="20" fill="#d9d4ca">Proof of concept · MVP · into production — sleeves rolled up, in the code</text>

  <!-- Foundation -->
  <rect x="112" y="450" width="976" height="86" rx="10" fill="#ffffff" stroke="#0d6b5f" stroke-width="2"/>
  <text x="140" y="486" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#084a42">Foundation · a hands-on architect, a small core, and the agents that multiply both</text>
  <text x="140" y="514" font-family="Arial, sans-serif" font-size="18" fill="#3c3832">Under a real mandate — what kills an architecture is missing mandate, not headcount.</text>
</svg>
